description='''次元物语：魔素（Dimensional Mana）是一套为 Minecraft 1.21.1 打造的深度魔法、硬核战斗与图形化法术编程的综合 NeoForge 模组。

【核心玩法】
⚔️ 武备与词条：引入 C~SSS 级随机词条系统与史诗级“魔精钢”套装，配合武备加工台，体验暗黑类刷宝与打铁强化的极致乐趣。
🔮 魔导科技：强大的“魔法阵编程系统”，通过绘制法阵、连接节点、编译词缀，搭建全自动魔法陷阱与逻辑电路。
🛡️ 双轨资源：掌握魔素（施法蓝条）与斗气（减伤护盾），体验硬核的完美招架与弹反机制。
🌪️ 元素与生态：12 种元素属性、17 种元素反应；面对 12 种元素史莱姆、哥布林阵营以及拥有恐怖机制的“魔蚀凋零”与“虚无魔龙”等强力 Boss。
📖 指引与成就：游戏内自带《万法知识之书》与《战斗手册》，更有 120 个庞大且连贯的成就节点指引你的冒险。

【基础信息】
游戏版本：Minecraft 1.21.1
加载器：NeoForge 21.1+
当前版本：${mod_version}
作者：TakisueYuu、AutoMods
语言：简体中文 / English'''

